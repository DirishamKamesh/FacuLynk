# ========================================
# FacuLynk Backend — Application Configuration
# ========================================

server:
  port: 8080

spring:
  application:
    name: faculynk-backend

  # ---- MySQL DataSource ----
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:faculynk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  # ---- JPA / Hibernate ----
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ---- Flyway ----
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

# ---- JWT Configuration ----
app:
  jwt:
    secret: ${JWT_SECRET:faculynk-dev-secret-key-minimum-256-bits-long-for-hmac-sha256-algorithm}
    expiration-ms: 28800000  # 8 hours
    cookie-name: FACULYNK_TOKEN
    cookie-secure: ${COOKIE_SECURE:false}

  # ---- CORS ----
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:3000,http://localhost:5173}
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Content-Type,Accept,X-Requested-With
    allow-credentials: true
    max-age: 3600

# ---- Logging ----
logging:
  level:
    com.faculynk: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
