# ========================================
# FacuLynk Backend - Local Configuration
# ========================================
# Uses H2 file-based database with Flyway schema migration & seed data.

server:
  port: 8080

spring:
  application:
    name: faculynk-backend-local

  datasource:
    url: jdbc:h2:file:./data/faculynk_local;DB_CLOSE_DELAY=-1;MODE=MySQL;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  jwt:
    secret: faculynk-dev-secret-key-minimum-256-bits-long-for-hmac-sha256-algorithm
    expiration-ms: 28800000
    cookie-name: FACULYNK_TOKEN
    cookie-secure: false
  cors:
    allowed-origins: http://localhost:3000,http://localhost:5173
    allowed-methods: GET,POST,PUT,DELETE,OPTIONS
    allowed-headers: Content-Type,Accept,X-Requested-With
    allow-credentials: true
    max-age: 3600

logging:
  level:
    com.faculynk: DEBUG
    org.flywaydb: INFO
